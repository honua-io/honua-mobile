version: 2
registries:
  github-honua:
    type: nuget-feed
    url: https://nuget.pkg.github.com/honua-io/index.json
    token: ${{secrets.HONUA_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    registries:
      - github-honua
    schedule:
      interval: "weekly"
    groups:
      dotnet-mobile:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/src/Honua.Embed"
    schedule:
      interval: "weekly"
    groups:
      embed:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
