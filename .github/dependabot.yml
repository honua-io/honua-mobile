version: 2
registries:
  github-honua:
    type: nuget-feed
    url: https://nuget.pkg.github.com/honua-io/index.json
    token: ${{secrets.HONUA_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    registries:
      - github-honua
    schedule:
      interval: "weekly"
    groups:
      dotnet-mobile:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/src/Honua.Embed"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 (native port) drops the JS compiler API that Angular's
      # ngc (build:angular) depends on. Stay on TS 6 until Angular supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The Angular wrapper declares a peer range of ">=17 <22", so it must
      # not be compiled with an Angular major outside that range. Widen the
      # peer range deliberately before moving the compiler to Angular 22+.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
    groups:
      embed:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
