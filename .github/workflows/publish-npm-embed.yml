name: Publish Embed npm Package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run validation only (skip publish)"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "mobile-embed-v*"

permissions:
  contents: read

env:
  NODE_VERSION: "24.x"

jobs:
  package-smoke:
    name: Package Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      package-version: ${{ steps.version.outputs.package_version }}
      tag-object: ${{ steps.verify-tag.outputs.tag_object }}
      package-name: ${{ steps.pack.outputs.package_name }}
    defaults:
      run:
        working-directory: src/Honua.Embed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          scope: "@honua-io"

      - name: Install dependencies
        run: npm ci

      - name: Validate package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"

          if [[ -z "${package_version}" ]]; then
            echo "Could not resolve package version from package.json."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#mobile-embed-v}"
            if [[ "${tag_version}" != "${package_version}" ]]; then
              echo "Tag version (${tag_version}) does not match package.json version (${package_version})."
              exit 1
            fi
          fi

          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"
          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Verify signed release tag
        id: verify-tag
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_object="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}")"
          if [[ "$(git cat-file -t "${tag_object}")" != "tag" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must be annotated and signed."
            exit 1
          fi
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified')" != "true" ]]; then
            echo "::error::GitHub did not verify the signature on ${GITHUB_REF_NAME}."
            exit 1
          fi
          # Bind the verified tag to the commit this run checked out and built:
          # a tag moved after the push event must not lend its signature to
          # artifacts built from a different commit.
          tag_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Verified tag ${GITHUB_REF_NAME} points at ${tag_commit}, but this run built ${GITHUB_SHA}."
            exit 1
          fi
          echo "tag_object=${tag_object}" >> "${GITHUB_OUTPUT}"

      - name: Block manual publishing outside signed releases
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true' }}
        run: |
          echo "::error::@honua-io/embed publishes only from signed mobile-embed-v* release tags. Use dry_run=true for manual validation."
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack npm package
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/npm-packages"
          npm pack --pack-destination "${GITHUB_WORKSPACE}/npm-packages"
          package="$(find "${GITHUB_WORKSPACE}/npm-packages" -maxdepth 1 -type f -name '*.tgz' -printf '%f\n' | sort | head -n 1)"
          if [[ -z "${package}" ]]; then
            echo "::error::npm pack did not produce a tarball."
            exit 1
          fi
          (
            cd "${GITHUB_WORKSPACE}/npm-packages"
            sha256sum "${package}" > SHA256SUMS
          )
          echo "package_name=${package}" >> "${GITHUB_OUTPUT}"

      - name: Verify packed package import
        shell: bash
        run: |
          package="$(find "${GITHUB_WORKSPACE}/npm-packages" -maxdepth 1 -type f -name '*.tgz' | sort | head -n 1)"
          tmp_dir="$(mktemp -d)"

          npm install "${package}" --prefix "${tmp_dir}" --ignore-scripts
          cd "${tmp_dir}"
          node --input-type=module <<'NODE'
          const embed = await import('@honua-io/embed');
          if (typeof embed.defineHonuaMapElement !== 'function' ||
              typeof embed.defineHonuaSceneElement !== 'function') {
            throw new Error('Packed @honua-io/embed package does not expose expected entrypoints.');
          }
          NODE

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: honua-mobile-embed-${{ github.run_id }}-packages
          path: |
            npm-packages/*.tgz
            npm-packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Attest npm tarball provenance
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: npm-packages/*.tgz

      - name: Upload CDN dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: honua-mobile-embed-${{ github.run_id }}-cdn-dist
          path: src/Honua.Embed/dist/
          if-no-files-found: error
          retention-days: 90

      - name: Dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        shell: bash
        run: |
          echo "Dry run complete. Built npm package:" >> "${GITHUB_STEP_SUMMARY}"
          ls -1 "${GITHUB_WORKSPACE}"/npm-packages/*.tgz >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "CDN dist artifact includes manifest:" >> "${GITHUB_STEP_SUMMARY}"
          echo "${GITHUB_WORKSPACE}/src/Honua.Embed/dist/cdn-manifest.json" >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish to npmjs.com
    needs: package-smoke
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: public-npm
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: honua-mobile-embed-${{ github.run_id }}-packages
          path: npm-packages

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          scope: "@honua-io"

      - name: Refuse an existing public version
        env:
          PACKAGE_VERSION: ${{ needs.package-smoke.outputs.package-version }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/@honua-io%2fembed/${PACKAGE_VERSION}")"
          if [[ "${status}" == "200" ]]; then
            echo "::error::@honua-io/embed ${PACKAGE_VERSION} already exists on npmjs.com; release versions are immutable."
            exit 1
          fi
          if [[ "${status}" != "404" ]]; then
            echo "::error::Could not prove @honua-io/embed ${PACKAGE_VERSION} is absent on npmjs.com (HTTP ${status})."
            exit 1
          fi

      - name: Require an npm CLI that supports Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          # npm >= 11.5.1 exchanges the Actions OIDC token for short-lived
          # registry credentials at publish time; the same token backs the
          # Sigstore provenance statement.
          npm_version="$(npm --version)"
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "${npm_version}"; then
            echo "::error::npm ${npm_version} cannot use npm Trusted Publishing (need >= 11.5.1)."
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "::error::Actions OIDC token unavailable (id-token: write missing?)."
            exit 1
          fi

      - name: Publish immutable package to npmjs.com
        shell: bash
        env:
          # Trusted Publishing (OIDC) is the release credential; npmjs.com names
          # this repository and workflow as @honua-io/embed's trusted publisher.
          # npm can only attach a trusted publisher to a package that already
          # exists, so the one-time first publish may use a short-lived
          # NPM_BOOTSTRAP_TOKEN environment secret, which must be deleted
          # immediately after that release.
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${NPM_BOOTSTRAP_TOKEN}" ]]; then
            echo "::warning::Publishing with NPM_BOOTSTRAP_TOKEN. Configure npm Trusted Publishing for @honua-io/embed and delete this secret."
            export NODE_AUTH_TOKEN="${NPM_BOOTSTRAP_TOKEN}"
          fi
          unset NPM_BOOTSTRAP_TOKEN
          package="$(find "${GITHUB_WORKSPACE}/npm-packages" -maxdepth 1 -type f -name '*.tgz' | sort | head -n 1)"

          if [[ -z "${package}" ]]; then
            echo "No npm package artifact found."
            exit 1
          fi

          npm publish "${package}" \
            --registry "https://registry.npmjs.org" \
            --access public \
            --provenance

  verify-public:
    name: Verify anonymous npm package
    needs: [package-smoke, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout locked dependency graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download expected package bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: honua-mobile-embed-${{ github.run_id }}-packages
          path: expected

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Restore the pinned runtime dependency graph
        working-directory: src/Honua.Embed
        run: npm ci --ignore-scripts

      - name: Fetch and import without credentials
        env:
          PACKAGE_VERSION: ${{ needs.package-smoke.outputs.package-version }}
          PACKAGE_NAME: ${{ needs.package-smoke.outputs.package-name }}
        run: |
          set -euo pipefail
          (
            cd expected
            sha256sum --check SHA256SUMS
          )
          # Retry the actual tarball fetch and byte comparison, not only the
          # metadata lookup: registry metadata can become visible before the
          # tarball is served, and a failure here happens after the immutable
          # version is already published.
          matched=false
          for attempt in $(seq 1 30); do
            rm -rf public-package
            mkdir public-package
            if npm pack "@honua-io/embed@${PACKAGE_VERSION}" --pack-destination public-package --registry "https://registry.npmjs.org" >/dev/null 2>&1 && [[ -f "public-package/${PACKAGE_NAME}" ]]; then
              if cmp --silent "expected/${PACKAGE_NAME}" "public-package/${PACKAGE_NAME}"; then
                matched=true
                break
              fi
              echo "::error::npmjs.com did not return the byte-identical tarball built and attested by this run."
              exit 1
            fi
            sleep 10
          done
          if [[ "${matched}" != "true" ]]; then
            echo "::error::npmjs.com did not serve the @honua-io/embed ${PACKAGE_VERSION} tarball anonymously."
            exit 1
          fi
          package_dir="${GITHUB_WORKSPACE}/src/Honua.Embed/node_modules/@honua-io/embed"
          rm -rf "${package_dir}"
          mkdir -p "${package_dir}"
          tar --extract \
            --gzip \
            --file "public-package/${PACKAGE_NAME}" \
            --directory "${package_dir}" \
            --strip-components 1
          cd "${GITHUB_WORKSPACE}/src/Honua.Embed"
          node --input-type=module <<'NODE'
          const embed = await import('@honua-io/embed');
          if (typeof embed.defineHonuaMapElement !== 'function' ||
              typeof embed.defineHonuaSceneElement !== 'function') {
            throw new Error('Public @honua-io/embed package does not expose expected entrypoints.');
          }
          NODE

  release:
    name: Create package release
    needs: [package-smoke, verify-public]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: honua-mobile-embed-${{ github.run_id }}-packages
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.package-smoke.outputs.package-version }}
          TAG_OBJECT: ${{ needs.package-smoke.outputs.tag-object }}
        run: |
          set -euo pipefail
          current_tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [[ -z "${TAG_OBJECT}" || "${current_tag_object}" != "${TAG_OBJECT}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} no longer names the signed tag object verified by this run."
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${GITHUB_REF_NAME} already exists; release versions are immutable."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/*.tgz release-assets/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "@honua-io/embed ${PACKAGE_VERSION}" \
            --notes "The tarball was installed and imported anonymously from npmjs.com before this release was created. Its SHA-256 is attached in SHA256SUMS."
