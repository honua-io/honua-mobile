name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: '11.0.100'  # current repo targets net11
  MAUI_DOTNET_VERSION: '11.0.100'
  NODE_VERSION: '24.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  maui-android:
    name: MAUI Android packaged SQLite qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: ${{ env.MAUI_DOTNET_VERSION }}

      - name: Configure GitHub Packages
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Install MAUI workload
        run: |
          dotnet workload install maui-android --version 11.0.100.1

      - name: Install Android SDK dependencies
        run: |
          dotnet build apps/Honua.Mobile.App/Honua.Mobile.App.csproj \
            -f net11.0-android \
            -t:InstallAndroidDependencies \
            -p:AcceptAndroidSDKLicenses=True

      - name: Restore MAUI Components
        run: |
          dotnet restore src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj

      - name: Build MAUI Components
        run: |
          dotnet build src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj \
            --configuration Release \
            --no-restore \
            /p:TreatWarningsAsErrors=true

      - name: Restore Android Apps
        run: |
          # Restore with the same configuration and RID as the build to resolve the ReadyToRun pack.
          dotnet restore apps/Honua.Mobile.App/Honua.Mobile.App.csproj \
            -p:Configuration=Release \
            -p:TargetFramework=net11.0-android \
            -p:RuntimeIdentifier=android-x64 \
            -p:RuntimeIdentifiers=android-x64

          dotnet restore src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj \
            -p:RuntimeIdentifier=android-x64 \
            -p:RuntimeIdentifiers=android-x64

      - name: Build Android Project References
        run: |
          dotnet build src/Honua.Mobile.Sdk/Honua.Mobile.Sdk.csproj \
            --configuration Release \
            --no-restore \
            /p:RuntimeIdentifier=android-x64 \
            /p:RuntimeIdentifiers=android-x64 \
            /p:TreatWarningsAsErrors=true

          dotnet build src/Honua.Mobile.Offline/Honua.Mobile.Offline.csproj \
            --configuration Release \
            --no-restore \
            /p:RuntimeIdentifier=android-x64 \
            /p:RuntimeIdentifiers=android-x64 \
            /p:TreatWarningsAsErrors=true

          dotnet build src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj \
            --configuration Release \
            --no-restore \
            /p:RuntimeIdentifier=android-x64 \
            /p:RuntimeIdentifiers=android-x64 \
            /p:TreatWarningsAsErrors=true

      - name: Build Android Apps
        run: |
          dotnet build apps/Honua.Mobile.App/Honua.Mobile.App.csproj \
            --configuration Release \
            --framework net11.0-android \
            --no-restore \
            /p:RuntimeIdentifier=android-x64 \
            /p:RuntimeIdentifiers=android-x64 \
            /p:TreatWarningsAsErrors=true

      - name: Android trim smoke
        run: |
          # Keep direct mobile-code trim warnings blocking, but do not fail on assembly-level
          # summaries emitted by upstream NuGet packages during the baseline app smoke.
          # Disable ReadyToRun for this linker smoke; the Release build above uses the default.
          dotnet publish apps/Honua.Mobile.App/Honua.Mobile.App.csproj \
            --configuration Release \
            --framework net11.0-android \
            /p:RuntimeIdentifier=android-x64 \
            /p:RuntimeIdentifiers=android-x64 \
            /p:PublishTrimmed=true \
            /p:PublishReadyToRun=false \
            /p:TrimMode=full \
            /p:TreatWarningsAsErrors=true \
            /p:WarningsNotAsErrors=IL2104 \
            /p:AndroidPackageFormat=apk

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Exercise packaged SQLite on Android API 33
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/qualify-android-packaged-sqlite.sh
