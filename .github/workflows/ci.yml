name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'  # Current repo targets net10
  MAUI_DOTNET_VERSION: '10.0.100'
  NODE_VERSION: '24.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      src_changed: ${{ steps.filter.outputs.src_changed }}
      core_changed: ${{ steps.filter.outputs.core_changed }}
      test_changed: ${{ steps.filter.outputs.test_changed }}
      platform_changed: ${{ steps.filter.outputs.platform_changed }}
      android_smoke_changed: ${{ steps.filter.outputs.android_smoke_changed }}
      full_mobile_requested: ${{ steps.filter.outputs.full_mobile_requested }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce maintained documentation command policy
        run: |
          if git grep -n -i -w curl -- '*.md' '*.mdx' '*.rst' '*.txt'; then
            echo "::error::Maintained documentation must use supported SDK, CLI, or API-reference workflows."
            exit 1
          fi

      - name: Check for source changes
        id: filter
        env:
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          FULL_MOBILE_REQUESTED=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }})
            if printf '%s' "$PR_LABELS_JSON" | grep -Eiq '"(ci/full-mobile|ci/platform|full-mobile-ci)"'; then
              FULL_MOBILE_REQUESTED=true
            fi
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED_FILES="__full_mobile_ci__"
            FULL_MOBILE_REQUESTED=true
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [ -n "$BEFORE_SHA" ] && ! printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
              CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA"..${{ github.sha }})
            else
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
            fi
          fi

          match_changed() {
            local pattern="$1"
            printf '%s\n' "$CHANGED_FILES" | grep -E "$pattern" || true
          }

          SRC_CHANGED=$(match_changed '^(src/|apps/|proto/|quality/|scripts/|\.github/workflows/|tests/Honua\.Mobile\.PlatformSmoke/)')
          CORE_CHANGED=$(match_changed '^(src/|apps/|proto/|quality/|scripts/|tests/|\.github/workflows/|Directory\.(Build|Packages)\.props|global\.json|NuGet\.config|package(-lock)?\.json)')
          TEST_CHANGED=$(match_changed '^tests/')
          PLATFORM_CHANGED=$(match_changed '^(apps/Honua\.Mobile\.App/|apps/Honua\.Mobile\.FieldCollection/|src/Honua\.Mobile\.Maui/|tests/Honua\.Mobile\.Maui\.Tests/|tests/Honua\.Mobile\.PlatformSmoke/|scripts/run-(android|ios)-platform-smoke\.sh|\.github/workflows/ci\.yml|Directory\.(Build|Packages)\.props|global\.json|NuGet\.config)')
          ANDROID_SMOKE_CHANGED=$(match_changed '^(apps/Honua\.Mobile\.App/|apps/Honua\.Mobile\.FieldCollection/|src/Honua\.Mobile\.Maui/|tests/Honua\.Mobile\.PlatformSmoke/|scripts/run-android-platform-smoke\.sh|\.github/workflows/ci\.yml|Directory\.(Build|Packages)\.props|global\.json|NuGet\.config)')

          if [ "$FULL_MOBILE_REQUESTED" = "true" ]; then
            SRC_CHANGED="${SRC_CHANGED:-__full_mobile_ci__}"
            CORE_CHANGED="${CORE_CHANGED:-__full_mobile_ci__}"
            PLATFORM_CHANGED="${PLATFORM_CHANGED:-__full_mobile_ci__}"
            ANDROID_SMOKE_CHANGED="${ANDROID_SMOKE_CHANGED:-__full_mobile_ci__}"
          fi

          set_bool_output() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          set_bool_output src_changed "$SRC_CHANGED"
          set_bool_output core_changed "$CORE_CHANGED"
          set_bool_output test_changed "$TEST_CHANGED"
          set_bool_output platform_changed "$PLATFORM_CHANGED"
          set_bool_output android_smoke_changed "$ANDROID_SMOKE_CHANGED"
          echo "full_mobile_requested=$FULL_MOBILE_REQUESTED" >> "$GITHUB_OUTPUT"

          echo "Changed files:"
          printf '%s\n' "$CHANGED_FILES"
          echo "Source files changed: $SRC_CHANGED"
          echo "Core CI files changed: $CORE_CHANGED"
          echo "Test files changed: $TEST_CHANGED"
          echo "Platform files changed: $PLATFORM_CHANGED"
          echo "Android smoke files changed: $ANDROID_SMOKE_CHANGED"
          echo "Full mobile CI requested: $FULL_MOBILE_REQUESTED"

  build:
    name: Build & Format Check
    needs: changes
    if: ${{ needs.changes.outputs.core_changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build-succeeded: ${{ steps.build.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify branch protection
        if: ${{ github.event_name == 'push' && vars.HONUA_VERIFY_BRANCH_PROTECTION == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.HONUA_BRANCH_PROTECTION_READ_TOKEN }}
        run: bash scripts/verify-branch-protection.sh "${GITHUB_REF_NAME}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure GitHub Packages
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore src/Honua.Mobile.Sdk/Honua.Mobile.Sdk.csproj
          dotnet restore src/Honua.Mobile.Offline/Honua.Mobile.Offline.csproj
          dotnet restore tools/Honua.Migrate.Maui.Cli/Honua.Migrate.Maui.Cli.csproj
          npm ci --prefix src/Honua.Embed

      - name: Build Core Libraries (warnings as errors)
        id: build
        run: |
          # Build cross-platform libraries first (these should build on any platform)
          dotnet build src/Honua.Mobile.Sdk/Honua.Mobile.Sdk.csproj \
            --no-restore --configuration Release /p:TreatWarningsAsErrors=true

          dotnet build src/Honua.Mobile.Offline/Honua.Mobile.Offline.csproj \
            --no-restore --configuration Release /p:TreatWarningsAsErrors=true

          # Migration tooling (honua-migrate maui codemod) — platform-neutral,
          # no MAUI workload required.
          dotnet build tools/Honua.Migrate.Maui.Cli/Honua.Migrate.Maui.Cli.csproj \
            --no-restore --configuration Release /p:TreatWarningsAsErrors=true

          npm run build --prefix src/Honua.Embed

      - name: Format Check
        run: |
          dotnet format src/Honua.Mobile.Sdk/Honua.Mobile.Sdk.csproj \
            --no-restore --verify-no-changes --verbosity diagnostic
          dotnet format src/Honua.Mobile.Offline/Honua.Mobile.Offline.csproj \
            --no-restore --verify-no-changes --verbosity diagnostic
          dotnet format tools/Honua.Migrate.Maui/Honua.Migrate.Maui.csproj \
            --no-restore --verify-no-changes --verbosity diagnostic
          dotnet format tools/Honua.Migrate.Maui.Cli/Honua.Migrate.Maui.Cli.csproj \
            --no-restore --verify-no-changes --verbosity diagnostic

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.core_changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure GitHub Packages
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore tests/Honua.Mobile.Sdk.Tests/Honua.Mobile.Sdk.Tests.csproj
          dotnet restore tests/Honua.Mobile.Offline.Tests/Honua.Mobile.Offline.Tests.csproj
          dotnet restore tests/Honua.Mobile.FieldCollection.Tests/Honua.Mobile.FieldCollection.Tests.csproj
          dotnet restore tests/Honua.Mobile.ServerIntegration.Tests/Honua.Mobile.ServerIntegration.Tests.csproj
          dotnet restore tests/Honua.Mobile.Maui.Tests/Honua.Mobile.Maui.Tests.csproj
          dotnet restore tests/Honua.Migrate.Maui.Tests/Honua.Migrate.Maui.Tests.csproj
          npm ci --prefix src/Honua.Embed

      - name: Create Test Results Directory
        run: mkdir -p ./TestResults

      - name: Build Test Projects
        run: |
          dotnet build tests/Honua.Mobile.Sdk.Tests/Honua.Mobile.Sdk.Tests.csproj \
            --no-restore --configuration Release
          dotnet build tests/Honua.Mobile.Offline.Tests/Honua.Mobile.Offline.Tests.csproj \
            --no-restore --configuration Release
          dotnet build tests/Honua.Mobile.FieldCollection.Tests/Honua.Mobile.FieldCollection.Tests.csproj \
            --no-restore --configuration Release
          dotnet build tests/Honua.Mobile.ServerIntegration.Tests/Honua.Mobile.ServerIntegration.Tests.csproj \
            --no-restore --configuration Release
          dotnet build tests/Honua.Mobile.Maui.Tests/Honua.Mobile.Maui.Tests.csproj \
            --no-restore --configuration Release
          dotnet build tests/Honua.Migrate.Maui.Tests/Honua.Migrate.Maui.Tests.csproj \
            --no-restore --configuration Release

      - name: Run SDK Tests
        run: |
          dotnet test tests/Honua.Mobile.Sdk.Tests/Honua.Mobile.Sdk.Tests.csproj \
            --no-build --no-restore --configuration Release \
            --logger "trx;LogFileName=sdk-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Run Offline Tests
        run: |
          dotnet test tests/Honua.Mobile.Offline.Tests/Honua.Mobile.Offline.Tests.csproj \
            --no-build --no-restore --configuration Release \
            --logger "trx;LogFileName=offline-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Run FieldCollection App Tests
        run: |
          dotnet test tests/Honua.Mobile.FieldCollection.Tests/Honua.Mobile.FieldCollection.Tests.csproj \
            --no-build --no-restore --configuration Release \
            --logger "trx;LogFileName=fieldcollection-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Run Server Integration Tests
        run: |
          dotnet test tests/Honua.Mobile.ServerIntegration.Tests/Honua.Mobile.ServerIntegration.Tests.csproj \
            --no-build --no-restore --configuration Release \
            --logger "trx;LogFileName=server-integration-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Run MAUI Component Tests
        run: |
          dotnet test tests/Honua.Mobile.Maui.Tests/Honua.Mobile.Maui.Tests.csproj \
            --no-build --no-restore --configuration Release \
            --logger "trx;LogFileName=maui-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Run Migration Codemod Tests
        run: |
          dotnet test tests/Honua.Migrate.Maui.Tests/Honua.Migrate.Maui.Tests.csproj \
            --no-build --no-restore --configuration Release \
            --logger "trx;LogFileName=migrate-maui-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Run Embed Component Tests
        run: npm test --prefix src/Honua.Embed

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  maui-android:
    name: MAUI Android Build & Trim Smoke
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.platform_changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.MAUI_DOTNET_VERSION }}

      - name: Configure GitHub Packages
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Install MAUI workload
        run: |
          dotnet workload install maui-android --skip-manifest-update

      - name: Restore MAUI Components
        run: |
          dotnet restore src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj

      - name: Build MAUI Components
        run: |
          dotnet build src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj \
            --configuration Release \
            --no-restore \
            /p:TreatWarningsAsErrors=true

      - name: Restore Android Apps
        run: |
          dotnet restore apps/Honua.Mobile.App/Honua.Mobile.App.csproj \
            -p:TargetFramework=net10.0-android \
            -p:RuntimeIdentifiers=android-x64

          dotnet restore apps/Honua.Mobile.FieldCollection/Honua.Mobile.FieldCollection.csproj \
            -p:TargetFramework=net10.0-android \
            -p:RuntimeIdentifiers=android-x64

          dotnet restore apps/Honua.Mobile.FieldCollection.Core/Honua.Mobile.FieldCollection.Core.csproj \
            -p:RuntimeIdentifier=android-x64 \
            -p:RuntimeIdentifiers=android-x64

          dotnet restore src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj \
            -p:RuntimeIdentifier=android-x64 \
            -p:RuntimeIdentifiers=android-x64

      - name: Build Android Project References
        run: |
          dotnet build src/Honua.Mobile.Sdk/Honua.Mobile.Sdk.csproj \
            --configuration Release \
            --no-restore \
            /p:RuntimeIdentifier=android-x64 \
            /p:RuntimeIdentifiers=android-x64 \
            /p:TreatWarningsAsErrors=true

          dotnet build src/Honua.Mobile.Offline/Honua.Mobile.Offline.csproj \
            --configuration Release \
            --no-restore \
            /p:RuntimeIdentifier=android-x64 \
            /p:RuntimeIdentifiers=android-x64 \
            /p:TreatWarningsAsErrors=true

          dotnet build src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj \
            --configuration Release \
            --no-restore \
            /p:RuntimeIdentifier=android-x64 \
            /p:RuntimeIdentifiers=android-x64 \
            /p:TreatWarningsAsErrors=true

          dotnet build apps/Honua.Mobile.FieldCollection.Core/Honua.Mobile.FieldCollection.Core.csproj \
            --configuration Release \
            --no-restore \
            /p:RuntimeIdentifier=android-x64 \
            /p:RuntimeIdentifiers=android-x64 \
            /p:TreatWarningsAsErrors=true

      - name: Build Android Apps
        run: |
          dotnet build apps/Honua.Mobile.App/Honua.Mobile.App.csproj \
            --configuration Release \
            --framework net10.0-android \
            --no-restore \
            /p:RuntimeIdentifiers=android-x64 \
            /p:TreatWarningsAsErrors=true

          dotnet build apps/Honua.Mobile.FieldCollection/Honua.Mobile.FieldCollection.csproj \
            --configuration Release \
            --framework net10.0-android \
            --no-restore \
            /p:RuntimeIdentifiers=android-x64 \
            /p:TreatWarningsAsErrors=true

      - name: Android trim smoke
        if: needs.changes.outputs.android_smoke_changed == 'true'
        run: |
          # Keep direct mobile-code trim warnings blocking, but do not fail on assembly-level
          # summaries emitted by upstream NuGet packages during the baseline app smoke.
          dotnet publish apps/Honua.Mobile.App/Honua.Mobile.App.csproj \
            --configuration Release \
            --framework net10.0-android \
            /p:RuntimeIdentifier=android-x64 \
            /p:RuntimeIdentifiers=android-x64 \
            /p:PublishTrimmed=true \
            /p:TrimMode=full \
            /p:TreatWarningsAsErrors=true \
            /p:WarningsNotAsErrors=IL2104 \
            /p:AndroidPackageFormat=apk

      - name: Enable KVM for Android emulator
        if: needs.changes.outputs.android_smoke_changed == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Android API 33 platform smoke
        if: needs.changes.outputs.android_smoke_changed == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          HONUA_MOBILE_SMOKE_BASE_URL: ${{ vars.HONUA_MOBILE_SMOKE_BASE_URL }}
          HONUA_MOBILE_SMOKE_SERVICE_ID: ${{ vars.HONUA_MOBILE_SMOKE_SERVICE_ID }}
          HONUA_MOBILE_SMOKE_LAYER_ID: ${{ vars.HONUA_MOBILE_SMOKE_LAYER_ID }}
          HONUA_MOBILE_SMOKE_API_KEY: ${{ secrets.HONUA_MOBILE_SMOKE_API_KEY }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            adb shell getprop ro.build.version.sdk
            scripts/run-android-platform-smoke.sh

  maui-ios:
    name: MAUI iOS Build & AOT Smoke
    runs-on: macos-latest
    needs: changes
    if: ${{ needs.changes.outputs.platform_changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.MAUI_DOTNET_VERSION }}

      - name: Configure GitHub Packages
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Select Xcode 26.0
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          xcodebuild -version

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Verify iOS 17+ simulator runtime
        run: xcrun simctl list runtimes | grep -E "iOS (1[7-9]|2[0-9])"

      - name: Check iOS asset compiler availability
        id: ios_tools
        run: |
          xcode_developer_dir="$(xcode-select -p)"
          xcodebuild_bin="${xcode_developer_dir}/usr/bin/xcodebuild"
          macos_sdk="${xcode_developer_dir}/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
          if "${xcodebuild_bin}" -sdk "${macos_sdk}" -find actool > /tmp/actool-path 2> /tmp/actool-error; then
            actool_path="$(head -n 1 /tmp/actool-path)"
            echo "${actool_path}"
            if [[ -n "${actool_path}" && "${actool_path}" == "${xcode_developer_dir}/"* ]]; then
              echo "actool_available=true" >> "${GITHUB_OUTPUT}"
            else
              echo "::warning::actool resolved outside the selected Xcode developer directory (${actool_path:-<empty>}); skipping iOS app asset and publish smoke."
              echo "actool_available=false" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "::warning::actool is unavailable through the selected Xcode asset-tool lookup on this GitHub-hosted image; skipping iOS app asset and publish smoke."
            cat /tmp/actool-error
            echo "actool_available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Restore MAUI Components
        run: |
          dotnet restore src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj

      - name: Build MAUI Components
        run: |
          dotnet build src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj \
            --configuration Release \
            --no-restore \
            /p:TreatWarningsAsErrors=true

      - name: Restore iOS Apps
        if: steps.ios_tools.outputs.actool_available == 'true'
        run: |
          dotnet restore apps/Honua.Mobile.FieldCollection/Honua.Mobile.FieldCollection.csproj \
            -p:TargetFramework=net10.0-ios \
            -p:RuntimeIdentifier=iossimulator-x64 \
            -p:RuntimeIdentifiers=iossimulator-x64

          dotnet restore apps/Honua.Mobile.App/Honua.Mobile.App.csproj \
            -p:TargetFramework=net10.0-ios \
            '-p:RuntimeIdentifiers=iossimulator-x64;ios-arm64'

          dotnet restore apps/Honua.Mobile.FieldCollection.Core/Honua.Mobile.FieldCollection.Core.csproj

          dotnet restore src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj

      - name: Build iOS Apps
        if: steps.ios_tools.outputs.actool_available == 'true'
        run: |
          dotnet build apps/Honua.Mobile.App/Honua.Mobile.App.csproj \
            --configuration Release \
            --framework net10.0-ios \
            /p:RuntimeIdentifier=iossimulator-x64 \
            /p:TreatWarningsAsErrors=true

          dotnet build apps/Honua.Mobile.FieldCollection/Honua.Mobile.FieldCollection.csproj \
            --configuration Release \
            --framework net10.0-ios \
            /p:RuntimeIdentifier=iossimulator-x64 \
            /p:TreatWarningsAsErrors=true

      - name: iOS trim and NativeAOT smoke
        if: steps.ios_tools.outputs.actool_available == 'true'
        run: |
          # Keep direct mobile-code trim/AOT warnings blocking, but do not fail on assembly-level
          # summaries emitted by upstream NuGet packages during the baseline app smoke.
          dotnet publish apps/Honua.Mobile.App/Honua.Mobile.App.csproj \
            --configuration Release \
            --framework net10.0-ios \
            /p:RuntimeIdentifier=ios-arm64 \
            /p:PublishTrimmed=true \
            /p:TrimMode=full \
            /p:PublishAot=true \
            /p:PublishAotUsingRuntimePack=true \
            /p:EnableCodeSigning=false \
            /p:ArchiveOnBuild=false \
            /p:TreatWarningsAsErrors=true \
            /p:WarningsNotAsErrors=IL2104%3BIL3053

      - name: iOS simulator platform smoke
        if: steps.ios_tools.outputs.actool_available == 'true'
        env:
          HONUA_MOBILE_SMOKE_BASE_URL: ${{ vars.HONUA_MOBILE_SMOKE_BASE_URL }}
          HONUA_MOBILE_SMOKE_SERVICE_ID: ${{ vars.HONUA_MOBILE_SMOKE_SERVICE_ID }}
          HONUA_MOBILE_SMOKE_LAYER_ID: ${{ vars.HONUA_MOBILE_SMOKE_LAYER_ID }}
          HONUA_MOBILE_SMOKE_API_KEY: ${{ secrets.HONUA_MOBILE_SMOKE_API_KEY }}
        run: |
          scripts/run-ios-platform-smoke.sh

  maui-windows:
    name: MAUI Windows Build
    runs-on: windows-latest
    needs: changes
    if: ${{ needs.changes.outputs.platform_changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.MAUI_DOTNET_VERSION }}

      - name: Configure GitHub Packages
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore MAUI Components
        run: |
          dotnet restore src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj

      - name: Build MAUI Components (Windows)
        run: |
          dotnet build src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj `
            --configuration Release `
            --no-restore

      - name: Restore Windows Apps
        run: |
          dotnet restore apps/Honua.Mobile.App/Honua.Mobile.App.csproj `
            -p:TargetFramework=net10.0-windows10.0.19041.0 `
            -p:RuntimeIdentifier=win-x64 `
            -p:RuntimeIdentifiers=win-x64 `
            -p:Platform=x64

          dotnet restore apps/Honua.Mobile.FieldCollection/Honua.Mobile.FieldCollection.csproj `
            -p:TargetFramework=net10.0-windows10.0.19041.0 `
            -p:RuntimeIdentifier=win-x64 `
            -p:RuntimeIdentifiers=win-x64 `
            -p:Platform=x64

          dotnet restore apps/Honua.Mobile.FieldCollection.Core/Honua.Mobile.FieldCollection.Core.csproj `
            -p:Platform=x64

          dotnet restore src/Honua.Mobile.Maui/Honua.Mobile.Maui.csproj

      - name: Build Reference App (Windows)
        run: |
          dotnet build apps/Honua.Mobile.App/Honua.Mobile.App.csproj `
            --configuration Release `
            --framework net10.0-windows10.0.19041.0 `
            --no-restore `
            /p:Platform=x64

      - name: Build Field Collection App (Windows)
        run: |
          dotnet build apps/Honua.Mobile.FieldCollection/Honua.Mobile.FieldCollection.csproj `
            --configuration Release `
            --framework net10.0-windows10.0.19041.0 `
            --no-restore `
            /p:Platform=x64

  grpc-validation:
    name: gRPC Protocol Validation
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.core_changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure GitHub Packages
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Validate gRPC Protocol Compatibility
        run: |
          # Check if proto files are valid
          if [ -d "proto" ]; then
            echo "📡 Validating gRPC protocol definitions..."
            # Add buf or protoc validation here if proto files exist
            echo "✅ Proto validation passed"
          else
            echo "ℹ️ No proto files to validate"
          fi

      - name: SDK Integration Test
        run: |
          # Build a simple integration test to verify SDK can connect
          echo "🔌 Testing SDK integration points..."
          dotnet build src/Honua.Mobile.Sdk/Honua.Mobile.Sdk.csproj --configuration Release
          echo "✅ SDK integration test passed"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.core_changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure GitHub Packages
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Restore and Build for Analysis
        run: |
          dotnet restore src/Honua.Mobile.Sdk/Honua.Mobile.Sdk.csproj
          dotnet restore src/Honua.Mobile.Offline/Honua.Mobile.Offline.csproj
          # Build cross-platform libraries for security analysis
          dotnet build src/Honua.Mobile.Sdk/Honua.Mobile.Sdk.csproj --no-restore --configuration Release
          dotnet build src/Honua.Mobile.Offline/Honua.Mobile.Offline.csproj --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.core_changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure GitHub Packages
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Smoke Tests
        run: |
          dotnet restore tests/Honua.Mobile.Smoke.Tests/Honua.Mobile.Smoke.Tests.csproj

      - name: Build Smoke Tests
        run: |
          dotnet build tests/Honua.Mobile.Smoke.Tests/Honua.Mobile.Smoke.Tests.csproj \
            --no-restore --configuration Release

      - name: Run Smoke Tests
        run: |
          dotnet test tests/Honua.Mobile.Smoke.Tests/Honua.Mobile.Smoke.Tests.csproj \
            --no-build --no-restore --configuration Release \
            --logger "trx;LogFileName=smoke-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./TestResults

      - name: Validate Performance Budgets
        run: |
          echo "Validating performance budgets against assembly sizes..."
          BUDGET_FILE="quality/performance-budget.json"
          if [ ! -f "$BUDGET_FILE" ]; then
            echo "::error::Performance budget file not found at $BUDGET_FILE"
            exit 1
          fi

          SDK_DLL="src/Honua.Mobile.Sdk/bin/Release/net10.0/Honua.Mobile.Sdk.dll"
          OFFLINE_DLL="src/Honua.Mobile.Offline/bin/Release/net10.0/Honua.Mobile.Offline.dll"

          # Build the source projects so we can measure assembly sizes
          dotnet build src/Honua.Mobile.Sdk/Honua.Mobile.Sdk.csproj --configuration Release --no-restore 2>/dev/null || \
            dotnet build src/Honua.Mobile.Sdk/Honua.Mobile.Sdk.csproj --configuration Release
          dotnet build src/Honua.Mobile.Offline/Honua.Mobile.Offline.csproj --configuration Release --no-restore 2>/dev/null || \
            dotnet build src/Honua.Mobile.Offline/Honua.Mobile.Offline.csproj --configuration Release

          WARNING_KB=$(python3 -c "import json; print(json.load(open('$BUDGET_FILE'))['budgets']['sdk_package_size_kb']['warning'])")
          ERROR_KB=$(python3 -c "import json; print(json.load(open('$BUDGET_FILE'))['budgets']['sdk_package_size_kb']['error'])")

          TOTAL_SIZE_KB=0
          BUDGET_EXCEEDED=false

          for DLL in $SDK_DLL $OFFLINE_DLL; do
            if [ -f "$DLL" ]; then
              SIZE_BYTES=$(stat -c%s "$DLL")
              SIZE_KB=$((SIZE_BYTES / 1024))
              TOTAL_SIZE_KB=$((TOTAL_SIZE_KB + SIZE_KB))
              echo "  $(basename $DLL): ${SIZE_KB} KB"
            else
              echo "::warning::Assembly not found: $DLL"
            fi
          done

          echo ""
          echo "Total assembly size: ${TOTAL_SIZE_KB} KB"
          echo "  Warning threshold: ${WARNING_KB} KB"
          echo "  Error threshold:   ${ERROR_KB} KB"

          if [ "$TOTAL_SIZE_KB" -gt "$ERROR_KB" ]; then
            echo "::error::Performance budget EXCEEDED - total assembly size ${TOTAL_SIZE_KB} KB > ${ERROR_KB} KB"
            BUDGET_EXCEEDED=true
          elif [ "$TOTAL_SIZE_KB" -gt "$WARNING_KB" ]; then
            echo "::warning::Performance budget WARNING - total assembly size ${TOTAL_SIZE_KB} KB > ${WARNING_KB} KB"
          else
            echo "Performance budget OK"
          fi

          if [ "$BUDGET_EXCEEDED" = true ]; then
            exit 1
          fi

      - name: Upload Smoke Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-results
          path: TestResults/
          retention-days: 7

  fast-pr-gate:
    name: Fast PR Gate
    runs-on: ubuntu-latest
    needs: [changes, build, test, grpc-validation, security, quality-gates]
    if: always()
    steps:
      - name: Check fast feedback jobs
        run: |
          echo "Checking fast feedback job results..."
          dependabot_pr="${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}"
          core_changed="${{ needs.changes.outputs.core_changed }}"

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Detect Changes failed with result: ${{ needs.changes.result }}"
            exit 1
          fi

          require_fast_job() {
            local name="$1"
            local result="$2"

            if [[ "$result" == "success" ]]; then
              return 0
            fi

            if [[ "$dependabot_pr" == "true" && "$result" == "skipped" ]]; then
              echo "$name skipped for Dependabot PR"
              return 0
            fi

            if [[ "$core_changed" != "true" && "$result" == "skipped" ]]; then
              echo "$name skipped because no core CI paths changed"
              return 0
            fi

            echo "$name failed with result: $result"
            exit 1
          }

          require_fast_job "Build job" "${{ needs.build.result }}"
          require_fast_job "Test job" "${{ needs.test.result }}"
          require_fast_job "gRPC validation" "${{ needs.grpc-validation.result }}"
          require_fast_job "Security scan" "${{ needs.security.result }}"
          require_fast_job "Quality gates" "${{ needs.quality-gates.result }}"

          echo "Fast feedback checks passed."

  full-platform-confidence:
    name: Full Platform Confidence
    runs-on: ubuntu-latest
    needs: [changes, maui-android, maui-ios, maui-windows]
    if: always()
    steps:
      - name: Check platform confidence jobs
        run: |
          echo "Checking platform confidence job results..."
          dependabot_pr="${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}"
          platform_changed="${{ needs.changes.outputs.platform_changed }}"

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Detect Changes failed with result: ${{ needs.changes.result }}"
            exit 1
          fi

          require_platform_job() {
            local name="$1"
            local result="$2"

            if [[ "$result" == "success" ]]; then
              return 0
            fi

            if [[ "$dependabot_pr" == "true" && "$result" == "skipped" ]]; then
              echo "$name skipped for Dependabot PR"
              return 0
            fi

            if [[ "$platform_changed" != "true" && "$result" == "skipped" ]]; then
              echo "$name skipped because no app/platform paths changed"
              return 0
            fi

            echo "$name failed with result: $result"
            exit 1
          }

          require_platform_job "Android build" "${{ needs.maui-android.result }}"
          require_platform_job "iOS build" "${{ needs.maui-ios.result }}"
          require_platform_job "Windows build" "${{ needs.maui-windows.result }}"

          echo "Platform confidence checks passed."

  # Required fast gate. The full platform confidence check reports separately.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [fast-pr-gate]
    if: always()
    steps:
      - name: Check required fast gate succeeded
        run: |
          echo "Checking required CI result..."
          if [[ "${{ needs.fast-pr-gate.result }}" != "success" ]]; then
            echo "Fast PR Gate failed with result: ${{ needs.fast-pr-gate.result }}"
            exit 1
          fi

          echo "Required CI checks passed."
