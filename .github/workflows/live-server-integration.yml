name: Live Server Integration

# Intentionally NOT path-filtered: this workflow is intended to become a
# required status check on `main`. Required workflows that are skipped via
# `paths:` filters leave the status check in a pending state, blocking merges
# for unrelated PRs (e.g. docs-only changes). The job is cheap-ish thanks to
# pre-pull caching, NuGet cache, and a 20m timeout; if PR volume makes that
# painful, gate inside the job (`if:` on changed-paths output) rather than at
# the workflow trigger so the required check still reports success.
#
# Seed SQL: the live tests load `tests/seed/mobile-offline-demo-v1.sql`
# (vendored from honua-io/honua-server -- see tests/seed/UPSTREAM.md and
# tools/sync-mobile-offline-seed.sh) into the postgres container before the
# Honua server starts. Because the seed is vendored, every PR-trigger run
# is a fully-seeded run -- the dotnet test step is a hard gate, not a
# soft-fail. `workflow_dispatch` still accepts `fixture_sql_ref` to override
# the vendored seed with a fresh upstream snapshot for ad-hoc validation.
on:
  pull_request:
  push:
    branches: [main, trunk]
  workflow_dispatch:
    inputs:
      honua_server_image:
        description: "Honua server image tag to pull (default honuaio/honua-server:nightly -- tracks current trunk so the vendored seed schema matches)"
        required: false
        default: "honuaio/honua-server:nightly"
      fixture_sql_ref:
        description: "Optional honua-server git ref to fetch a fresh tests/seed/mobile-offline-demo-v1.sql snapshot. Leave empty to use the vendored seed."
        required: false
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: live-server-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"
  # Pinned honua-server image. `:nightly` tracks current trunk so the vendored
  # seed schema (tests/seed/mobile-offline-demo-v1.sql) matches; it is the
  # version the Compatibility-Train conformance checks run against. Recorded
  # explicitly here and echoed in the run (see "Record pinned versions").
  HONUA_SERVER_IMAGE: ${{ inputs.honua_server_image || 'honuaio/honua-server:nightly' }}
  HONUA_POSTGIS_IMAGE: "postgis/postgis:17-3.5-alpine"
  # Pinned geospatial-grpc conformance fixtures version (Compatibility Train,
  # epic geospatial-grpc#18). Mirror of <HonuaConformanceFixturesVersion> in
  # Directory.Build.props; provenance recorded in tests/conformance/UPSTREAM.md.
  HONUA_CONFORMANCE_FIXTURES_VERSION: "0.1.0-alpha.1"
  HONUA_CONFORMANCE_FIXTURES_REPO: "honua-io/geospatial-grpc"

jobs:
  live-server-integration:
    name: Live Server Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HONUA_MOBILE_LIVE_SERVER_TESTS: "1"
      HONUA_MOBILE_LIVE_SERVER_IMAGE: ${{ inputs.honua_server_image || 'honuaio/honua-server:nightly' }}
      HONUA_MOBILE_LIVE_SERVER_POSTGRES_IMAGE: "postgis/postgis:17-3.5-alpine"
      HONUA_MOBILE_ACCEPTANCE_EVIDENCE_DIR: ${{ github.workspace }}/CloudAcceptanceEvidence
    steps:
      - uses: actions/checkout@v7

      # Make the pinned versions this run gates against explicit in the log and
      # the job summary, so a reviewer can see exactly which honua-server image
      # and which geospatial-grpc conformance fixture version produced the result.
      - name: Record pinned versions
        run: |
          set -e
          server_digest="$(docker manifest inspect "${HONUA_SERVER_IMAGE}" 2>/dev/null \
            | sha256sum | awk '{print $1}' || echo 'unavailable')"
          {
            echo "### Live Server Integration — pinned versions"
            echo ""
            echo "| Anchor | Value |"
            echo "| --- | --- |"
            echo "| honua-server image | \`${HONUA_SERVER_IMAGE}\` |"
            echo "| PostGIS image | \`${HONUA_POSTGIS_IMAGE}\` |"
            echo "| geospatial-grpc conformance fixtures | \`${HONUA_CONFORMANCE_FIXTURES_VERSION}\` (repo \`${HONUA_CONFORMANCE_FIXTURES_REPO}\`) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Pinned honua-server image: ${HONUA_SERVER_IMAGE}"
          echo "Pinned conformance fixtures: ${HONUA_CONFORMANCE_FIXTURES_VERSION} from ${HONUA_CONFORMANCE_FIXTURES_REPO}"

      - name: Verify Docker available
        run: |
          docker version
          docker info | head -20

      - name: Pre-pull container images with retry
        run: |
          set -e
          pull_with_retry() {
            local image="$1"
            local attempts=3
            local delay=10
            for i in $(seq 1 $attempts); do
              echo "::group::docker pull $image (attempt $i/$attempts)"
              if docker pull "$image"; then
                echo "::endgroup::"
                return 0
              fi
              echo "::endgroup::"
              if [ "$i" -lt "$attempts" ]; then
                echo "Pull failed, retrying in ${delay}s..."
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            echo "::error::Failed to pull $image after $attempts attempts"
            return 1
          }
          pull_with_retry "${HONUA_SERVER_IMAGE}"
          pull_with_retry "${HONUA_POSTGIS_IMAGE}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure GitHub Packages
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-live-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-live-
            ${{ runner.os }}-nuget-

      - name: Restore integration test project
        run: dotnet restore tests/Honua.Mobile.ServerIntegration.Tests/Honua.Mobile.ServerIntegration.Tests.csproj

      - name: Build integration test project
        run: |
          dotnet build tests/Honua.Mobile.ServerIntegration.Tests/Honua.Mobile.ServerIntegration.Tests.csproj \
            --no-restore --configuration Release

      - name: Create artifact directories
        run: |
          mkdir -p TestResults
          mkdir -p "${HONUA_MOBILE_ACCEPTANCE_EVIDENCE_DIR}"

      # Pull the pinned, published geospatial-grpc conformance fixtures
      # (Compatibility Train, epic geospatial-grpc#18). The helper downloads the
      # conformance-fixtures-<version>.tar.gz release asset, verifies its SHA-256,
      # extracts it, re-verifies every file against the in-tarball SHA256SUMS, and
      # asserts the embedded VERSION equals the pin. The live suite asserts live
      # FeatureServer/OGC responses against these canonical contracts. GITHUB_TOKEN
      # has read scope for `gh release download` from the same org.
      - name: Fetch pinned conformance fixtures
        id: conformance-fixtures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          dest="${{ github.workspace }}/conformance-fixtures"
          tests/conformance/fetch-fixtures.sh \
            --version "${HONUA_CONFORMANCE_FIXTURES_VERSION}" \
            --repo "${HONUA_CONFORMANCE_FIXTURES_REPO}" \
            --dest "${dest}"
          test -d "${dest}/fixtures"
          test -s "${dest}/VERSION"
          echo "fixtures_dir=${dest}" >> "$GITHUB_OUTPUT"
          echo "Fetched conformance fixtures $(cat "${dest}/VERSION") into ${dest}"

      # The seed SQL is vendored at tests/seed/mobile-offline-demo-v1.sql
      # (see tests/seed/UPSTREAM.md for upstream provenance). PR-trigger runs
      # consume the vendored copy directly, so the live suite is fully seeded
      # on every PR and the dotnet test step below can be a hard gate.
      #
      # workflow_dispatch may override the vendored seed with a fresh upstream
      # snapshot by supplying `fixture_sql_ref`. The token must have read scope
      # on honua-io/honua-server for the sparse checkout to succeed; if it
      # doesn't, we fail loudly rather than silently falling back, because the
      # explicit override implies the caller wants that exact ref.
      - name: Resolve fixture seed SQL path
        id: fixture-seed
        run: |
          set -e
          if [ -n "${{ inputs.fixture_sql_ref }}" ]; then
            mkdir -p "${{ github.workspace }}/.fixture-seed"
            cd "${{ github.workspace }}/.fixture-seed"
            git init -q
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/honua-io/honua-server.git
            git config core.sparseCheckout true
            echo "tests/seed/mobile-offline-demo-v1.sql" > .git/info/sparse-checkout
            git fetch --depth=1 origin "${{ inputs.fixture_sql_ref }}"
            git checkout FETCH_HEAD -- tests/seed/mobile-offline-demo-v1.sql
            SEED_PATH="${{ github.workspace }}/.fixture-seed/tests/seed/mobile-offline-demo-v1.sql"
            echo "Using workflow_dispatch override seed at ${SEED_PATH} (ref ${{ inputs.fixture_sql_ref }})"
          else
            SEED_PATH="${{ github.workspace }}/tests/seed/mobile-offline-demo-v1.sql"
            echo "Using vendored seed at ${SEED_PATH}"
          fi
          test -s "${SEED_PATH}"
          echo "HONUA_MOBILE_LIVE_SERVER_FIXTURE_SQL=${SEED_PATH}" >> "$GITHUB_ENV"
          echo "seed_path=${SEED_PATH}" >> "$GITHUB_OUTPUT"

      # Hard gate: the vendored seed is present on every PR run, so a failure
      # here is a real failure and must block the PR. `workflow_dispatch` runs
      # that override the seed are equally strict -- the caller asked for that
      # ref to be exercised.
      - name: Run LiveHonuaServerInteractionTests
        id: live-tests
        env:
          # Point the suite at the verified, pinned conformance fixtures so its
          # FeatureServer/OGC contract checks assert against the shared canonical
          # geospatial.v1 payloads (not hand-written shapes).
          HONUA_MOBILE_CONFORMANCE_FIXTURES_DIR: ${{ steps.conformance-fixtures.outputs.fixtures_dir }}
        run: |
          dotnet test tests/Honua.Mobile.ServerIntegration.Tests/Honua.Mobile.ServerIntegration.Tests.csproj \
            --no-build --no-restore --configuration Release \
            --filter "FullyQualifiedName~LiveHonuaServerInteractionTests" \
            --logger "trx;LogFileName=live-server-integration.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./TestResults \
            --blame-hang-timeout 5m

      - name: Collect container logs on failure
        if: failure()
        run: |
          set +e
          mkdir -p "${HONUA_MOBILE_ACCEPTANCE_EVIDENCE_DIR}/container-logs"
          echo "=== docker ps -a ==="
          docker ps -a
          for cid in $(docker ps -aq); do
            name=$(docker inspect --format='{{.Name}}' "$cid" | tr -d '/' | tr ' ' '_')
            docker logs "$cid" > "${HONUA_MOBILE_ACCEPTANCE_EVIDENCE_DIR}/container-logs/${name}.log" 2>&1
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-server-integration-${{ github.run_id }}
          path: |
            TestResults/
            CloudAcceptanceEvidence/
          retention-days: 14
          if-no-files-found: ignore
